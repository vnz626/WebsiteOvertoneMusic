<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="50%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c28" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0b1018" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Accent Brand Gradient -->
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="50%" stop-color="#E8622C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="orbOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8622C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E8622C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(255, 255, 255, 0.06)"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="30" y="20" width="1140" height="260" rx="18"/>
    </clipPath>
  </defs>

  <style>
    @keyframes recPulse {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #ef4444); }
      50% { opacity: 0.2; filter: none; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1300px); }
    }
    @keyframes borderGlow {
      0%, 100% { stroke: rgba(232, 98, 44, 0.35); }
      50% { stroke: rgba(232, 98, 44, 0.75); }
    }

    .rec-dot { animation: recPulse 1.8s infinite ease-in-out; }
    .shimmer-anim { animation: sweepLine 6s infinite linear; }
    .card-border { animation: borderGlow 4s infinite ease-in-out; }
    
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Plus Jakarta Sans", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#gridPattern)"/>

  <!-- Ambient Cinematic Glows -->
  <circle cx="200" cy="60" r="160" fill="url(#orbOrange)"/>
  <circle cx="1020" cy="240" r="180" fill="url(#orbCyan)"/>
  <circle cx="600" cy="150" r="220" fill="url(#orbOrange)"/>

  <!-- Glass HUD Container Card -->
  <g clip-path="url(#cardClip)">
    <rect x="30" y="20" width="1140" height="260" rx="18" fill="url(#cardGrad)"/>
    <rect x="30" y="20" width="1140" height="260" rx="18" fill="none" class="card-border" stroke-width="1.5"/>

    <!-- Light Sweep Animation inside Card -->
    <rect y="20" width="140" height="260" fill="url(#shimmer)" class="shimmer-anim" opacity="0.35" transform="skewX(-20)"/>

    <!-- Viewfinder Corner Brackets -->
    <g stroke="rgba(255, 255, 255, 0.35)" stroke-width="2" fill="none">
      <path d="M 54 58 L 54 42 L 70 42" />
      <path d="M 1130 58 L 1146 58 L 1146 42 L 1130 42" />
      <path d="M 54 242 L 54 258 L 70 258" />
      <path d="M 1146 242 L 1146 258 L 1130 258" />
    </g>

    <!-- Top Status Bar: Cinema Viewfinder Metadata -->
    <g transform="translate(60, 48)">
      <!-- REC Indicator -->
      <circle cx="8" cy="8" r="5" fill="#EF4444" class="rec-dot"/>
      <text x="22" y="12" fill="#F87171" font-size="11" font-weight="800" letter-spacing="0.16em">REC ● 24 FPS</text>

      <!-- Center Specs -->
      <text x="540" y="12" text-anchor="middle" fill="rgba(255, 255, 255, 0.55)" font-size="11" font-weight="600" letter-spacing="0.12em">
        SHUTTER 180° · 4K DCI · PRORES RAW HQ
      </text>

      <!-- Right Timecode & ISO -->
      <text x="1080" y="12" text-anchor="end" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="0.1em">
        ISO 800 · TC 01:24:19:08
      </text>
    </g>

    <!-- Center Brand Title & Enterprise Subtitle -->
    <g transform="translate(600, 138)" text-anchor="middle">
      <!-- Main Brand Wordmark -->
      <text y="0" font-size="52" font-weight="800" letter-spacing="-0.035em" fill="#FFFFFF">
        Focalpoint<tspan fill="url(#brandAccent)" font-weight="900">.pro</tspan>
      </text>

      <!-- Subtitle: Business Scope -->
      <text y="30" font-size="12.5" font-weight="700" fill="rgba(255, 255, 255, 0.82)" letter-spacing="0.26em">
        CINEMA · BROADCAST · PRO GEAR ENTERPRISE
      </text>

      <!-- Subtitle: What is this website -->
      <text y="58" font-size="14.5" font-weight="500" fill="rgba(255, 255, 255, 0.72)" letter-spacing="0.02em">
        Omnichannel Retail ERP (TPS · OAS · KMS · MIS · DSS)
      </text>
    </g>

    <!-- 5 Enterprise Subsystem Pills (Static Coordinates, Never Overlaps) -->
    <g transform="translate(85, 224)">
      <!-- Pill 1: TPS -->
      <rect x="0" y="0" width="190" height="32" rx="16" fill="rgba(232, 98, 44, 0.12)" stroke="rgba(232, 98, 44, 0.45)" stroke-width="1"/>
      <text x="95" y="20" text-anchor="middle" fill="#FFA07A" font-size="11" font-weight="700" letter-spacing="0.03em">TPS · Transaksi &amp; POS</text>

      <!-- Pill 2: OAS -->
      <rect x="210" y="0" width="190" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="305" y="20" text-anchor="middle" fill="#7DD3FC" font-size="11" font-weight="700" letter-spacing="0.03em">OAS · Staf &amp; Outbox WA</text>

      <!-- Pill 3: KMS -->
      <rect x="420" y="0" width="190" height="32" rx="16" fill="rgba(52, 211, 153, 0.1)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
      <text x="515" y="20" text-anchor="middle" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="0.03em">KMS · Dual-Scope SOP</text>

      <!-- Pill 4: MIS -->
      <rect x="630" y="0" width="190" height="32" rx="16" fill="rgba(251, 191, 36, 0.1)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1"/>
      <text x="725" y="20" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700" letter-spacing="0.03em">MIS · Deadstock Simulator</text>

      <!-- Pill 5: DSS -->
      <rect x="840" y="0" width="190" height="32" rx="16" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
      <text x="935" y="20" text-anchor="middle" fill="#C084FC" font-size="11" font-weight="700" letter-spacing="0.03em">DSS · Hybrid AHP-TOPSIS</text>
    </g>
  </g>
</svg>
